[project]
name = "notes-api"
version = "0.0.1"
description = "A personal notes REST API"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.162.2",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
# The app runs from src/ without a build backend, so no extra build dependency.
package = false
required-version = "==0.12.23"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
